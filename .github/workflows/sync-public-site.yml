name: Sync public site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-public-site.yml"

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          path: pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          repository: mrblindbandit/mr-blindbandit-website
          ref: main
          path: source

      - name: Sync public directory
        run: |
          rsync -a --delete --exclude '.git/' --exclude '.github/' source/public/ pages/
          touch pages/.nojekyll

      - name: Commit and publish
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages mirror is already current."
            exit 0
          fi
          git commit -m "Deploy public site from mr-blindbandit-website"
          git push origin HEAD:main
